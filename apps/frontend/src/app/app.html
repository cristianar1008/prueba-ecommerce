<app-discount-alert />

<header class="topbar">
  <h1>{{ title }}</h1>
  <button type="button" class="cart-icon-button" (click)="toggleCart()" aria-label="Abrir carrito">
    <span aria-hidden="true">🛒</span>
    @if ((itemCount$ | async); as count) {
      @if (count > 0) {
        <span class="cart-badge">{{ count }}</span>
      }
    }
  </button>
</header>

<main class="layout">
  @if ((view$ | async) === 'checkout') {
    <app-checkout />
  } @else {
    <app-catalog />
  }
</main>

<app-cart />
